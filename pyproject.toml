[tool.poetry]
name = "crypto-com-developer-platform-client"
version = "1.1.0"
description = "A python client to interact with @cryptocom/developer-platform-service"
authors = ["Ric Arcifa <ricardo.arcifa@crypto.com>"]
license = "MIT"
keywords = ["blockchain", "crypto.com", "tool", "SDK"]
readme = "README.md"
homepage = "https://github.com/crypto-com/developer-platform-client-py"
repository = "https://github.com/crypto-com/developer-platform-client-py"
documentation = "https://github.com/crypto-com/developer-platform-client-py#readme"

[tool.poetry.dependencies]
python = "^3.8.1"
requests = "^2.32.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
pytest-mock = "^3.12.0"
responses = "^0.24.1"
coverage = "^7.6.1"
flake8 = "^7.1.1"
black = "^24.8.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         
    | \.git
    | \.tox
    | \.venv
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=crypto_com_developer_platform_client --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=80 -v"
markers = [
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.coverage.run]
source = ["crypto_com_developer_platform_client"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.poetry.scripts]
cryptocom-developer-platform-client = "crypto_com_developer_platform_client.cli:main"
